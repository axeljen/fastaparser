[project]
name = "fastaparser"
version = "0.1.0"
description = "A FASTA parsing and manipulation tool"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "pysam>=0.20.0",
    "biopython>=1.80",
]
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
fastaparser = "fastaparser.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "ruff>=0.0.250",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastaparser"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.ruff]
line-length = 100
target-version = "py38"
